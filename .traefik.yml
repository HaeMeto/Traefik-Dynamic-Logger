displayName: Dynamic Security Logger
type: middleware

import: github.com/HaeMeto/traefik_dynamic_logger

summary: Lightweight dynamic middleware—logs metadata, headers, and request body-size-limited

testData:
  apiEndpoint: http://security-api:8000
  blockTTL: 300
  maxBodyBytes: 65536
  pathPrefix: ""
  extraHeaders: ""
  denyIPs:
    - 1.2.3.4
  denyCountries:
    - RU
    - CN
  denyEmailDomains:
    - spam.com
    - bad.tld
  emailHeaders:
    - X-Email
    - X-Forwarded-Email
  countryHeader: X-Sec-Country
  listURL: http://security-api:8000/lists
  refreshSeconds: 60
