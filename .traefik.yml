displayName: Dynamic Security Logger
type: middleware
iconPath: .assets/icon.png

import: github.com/HaeMeto/traefik_dynamic_logger

summary: Lightweight dynamic middleware that logs all Data

testData:
  apiEndpoint: "http://security-api:8000"
  blockTTL: 300
  maxBodyBytes: 65536
  pathPrefix: ""
  extraHeaders: ""
  denyIPs: ["203.0.113.10","198.51.100.5"]
  denyCountries: ["RU","BY"]
  denyEmailDomains: ["spam.com","fraudmail.xyz"]
  emailHeaders: ["X-Email","X-Forwarded-Email"]
  countryHeader: "X-Sec-Country"
  listURL: "http://security-api:8000/lists"
  refreshSeconds: 60
